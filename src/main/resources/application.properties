# ===============================================
# Smart Complaint Management System Configuration
# ===============================================

spring.application.name=smart-complaint-management-system
server.port=8080

# -----------------------------------------------
# PostgreSQL Database Configuration
# -----------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_complaint_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -----------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema-postgresql.sql

# -----------------------------------------------
# Session & Server Management
# -----------------------------------------------
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# -----------------------------------------------
# Static Resources
# -----------------------------------------------
spring.web.resources.static-locations=classpath:/static/
